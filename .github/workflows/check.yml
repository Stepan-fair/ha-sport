name: Check sport app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python sport_diary/package.py
      - run: python sport_diary/browser_check.py
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m unittest discover -s sport_diary -p 'test_*.py'
      - run: node --test sport_diary/*.test.js
      - name: Check real form events in an isolated DOM
        run: |
          python sport_diary/package.py
          npm install --prefix "$RUNNER_TEMP/sport-dom" --no-save --package-lock=false jsdom@31.0.1
          export SPORT_DOM_MODULE="$RUNNER_TEMP/sport-dom/node_modules/jsdom"
          node sport_diary/dom_check.cjs
          node sport_diary/dom_check_training.cjs
          node sport_diary/dom_check_supplements.cjs
      - run: docker build -t sport-test sport_diary
      - name: Verify the complete food index and a barcode lookup without network
        run: |
          docker run --rm --network none sport-test python -c '
          import sqlite3
          from pathlib import Path
          import food_catalog as f
          path = Path(f.FILENAME)
          assert path.is_file()
          db = sqlite3.connect(path)
          assert db.execute("select count(*) from foods").fetchone()[0] == f.EXPECTED
          code = db.execute("select code from codes limit 1").fetchone()[0]
          catalog = f.Catalog(path, path)
          assert catalog.lookup(code)["products"][0]["code"] == code
          assert catalog.lookup("творог")["products"]'
      - name: Verify the bundled exercise photographs
        run: docker run --rm sport-test python -c 'import photos; assert all((photos.WEB / "photos" / name).read_bytes().startswith(bytes.fromhex("FFD8")) for name in photos.PHOTO_PATHS)'
      - name: Start image and check unauthenticated profile list
        run: |
          docker run -d --name sport-test sport-test
          for attempt in {1..15}; do
            if docker exec sport-test python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8099/profiles", timeout=2)) == []'; then
              exit 0
            fi
            sleep 1
          done
          docker logs sport-test
          exit 1
  cross-browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python sport_diary/package.py
      - name: Install test-only Chromium and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/sport-browser" --no-save --package-lock=false playwright@1.62.1
          "$RUNNER_TEMP/sport-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Exercise desktop keyboard and emulated iPhone touch on private test data
        run: NODE_PATH="$RUNNER_TEMP/sport-browser/node_modules" node sport_diary/browser_smoke.cjs
      - name: Exercise the nutrition assistant with the test diary
        run: NODE_PATH="$RUNNER_TEMP/sport-browser/node_modules" node sport_diary/browser_assistant.cjs
