configuration:
  person1_name:
    name: Первый профиль · имя в дневнике
    description: Имя для заголовка и переключателя профилей. Можно добавить эмодзи.
  person1_user:
    name: Первый профиль · ID пользователя HA
    description: В HA откройте Настройки → Люди → Пользователи, выберите учётную запись первого человека и скопируйте её ID. Сюда нужен ID учётной записи, например строка из 32 символов. Имя для входа и person.* сюда не подходят.
  person1_weight:
    name: Первый профиль · весы (по желанию)
    description: В Настройки → Устройства и службы → Сущности откройте показатель массы тела первого человека и скопируйте ID, например sensor.body_weight_1. Поддерживается также input_number с единицей массы. Вес подставляется автоматически.
  person2_name:
    name: Второй профиль · имя в дневнике
    description: Отображаемое имя второго человека. Можно добавить эмодзи.
  person2_user:
    name: Второй профиль · ID пользователя HA
    description: Скопируйте ID другой учётной записи из Настройки → Люди → Пользователи. Этот пользователь открывает только свой дневник. Для одного человека поле можно оставить пустым.
  person2_weight:
    name: Второй профиль · весы (по желанию)
    description: Выберите в разделе сущностей показатель массы именно второго человека и вставьте его ID, например sensor.body_weight_2. Если весов нет, оставьте поле пустым и вносите замеры в дневнике.
  person1_can_open_both:
    name: Разрешить первому пользователю оба дневника
    description: Включено — первый пользователь может просматривать и изменять оба дневника. Выключено — каждый открывает только свой. Права второго пользователя всегда ограничены его дневником.
  shared_diaries:
    name: Прежняя настройка общего доступа
    description: Использовалась в старых версиях. Доступом управляет переключатель «Разрешить первому пользователю оба дневника».
